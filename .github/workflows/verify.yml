name: TripTandem verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  functions-and-rules:
    name: Functions and Firebase emulator checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify cross-platform analytics parity
        run: node scripts/check_analytics_parity.mjs

      - name: Verify Remote Config parity and safe defaults
        run: node scripts/check_remote_config_parity.mjs

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build and test Functions
        run: npm test
        working-directory: functions

      - name: Run Firestore/Auth/Functions smoke matrix
        shell: bash
        run: |
          set -euo pipefail

          log_file="${RUNNER_TEMP}/triptandem-firebase-emulators.log"
          npx --yes firebase-tools@latest emulators:start \
            --only firestore,auth,functions \
            --project triptandem \
            --non-interactive >"${log_file}" 2>&1 &
          emulator_pid=$!

          cleanup() {
            kill "${emulator_pid}" 2>/dev/null || true
            wait "${emulator_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 90); do
            # Port 5001 opens before the Functions emulator has loaded the
            # regional definitions. Probe a real callable route so the smoke
            # runner cannot race that startup window and receive a misleading
            # 404 for an otherwise valid function.
            function_status="$(curl --silent --show-error --max-time 2 \
              --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:5001/triptandem/asia-southeast2/createTrip \
              || true)"
            if (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null \
              && (echo > /dev/tcp/127.0.0.1/9099) 2>/dev/null \
              && [ "${function_status}" != "000" ] \
              && [ "${function_status}" != "404" ]; then
              ready=true
              break
            fi
            if ! kill -0 "${emulator_pid}" 2>/dev/null; then
              echo "Firebase emulators exited before becoming ready."
              cat "${log_file}"
              exit 1
            fi
            sleep 1
          done

          if [ "${ready}" != true ]; then
            echo "Firebase emulators did not become ready in 90 seconds."
            cat "${log_file}"
            exit 1
          fi

          FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 \
            FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 \
            FUNCTIONS_EMULATOR_HOST=127.0.0.1:5001 \
            node scripts/firestore_rules_smoke.mjs
